services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codereview_backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-your_key_here}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - DATABASE_URL=sqlite:////app/data/reviews.db
    volumes:
      - sqlite_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codereview_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
